name: refresh site data
on:
  push:
    branches: [production]
    paths: ["config/**", "VERSION", "RELEASES.md", "scripts/gen_site_data.sh"]
  workflow_dispatch:

permissions: read-all

jobs:
  regen:
    runs-on: macos-latest
    permissions:
      contents: write   # commits the regenerated site data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Regenerate docs/data/site.json from the live config
        run: ./scripts/gen_site_data.sh
      - name: Commit if the site data changed
        run: |
          if [ -n "$(git status --porcelain docs/data/site.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/data/site.json
            git commit -m "Refresh site data"
            git push
          else
            echo "site data already current"
          fi
